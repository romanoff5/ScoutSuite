<!-- M10-D: dynamic fields use Handlebars HTML escaping; no unsafe triple mustaches. -->
<script id="services.inspector2.regions.id.accounts.partial" type="text/x-handlebars-template">
  <div class="list-group-item active"><h4>{{name}}</h4></div>
  <div class="list-group-item">
    <p>Account: <samp>{{account_id}}</samp></p>
    <p>Region: {{region}}</p>
    <p>Inspector status: {{status}}</p>
    <p>EC2: {{scan_types.ec2.status}}</p>
    <p>ECR: {{scan_types.ecr.status}}</p>
    <p>Lambda: {{scan_types.lambda.status}}</p>
    <p>Lambda code: {{scan_types.lambdaCode.status}}</p>
    <p>Coverage enumeration: {{coverage_summary.status}}</p>
    <p>Inspector records collected: {{coverage_summary.collected_records}}</p>
    <p>Inspector API statistical total: {{coverage_summary.inspector_reported_records}}</p>
    <p>Organization role: {{organization.role}}</p>
    <p>Organization assessment: {{organization.status}}</p>
    <p>Delegated administrator: {{organization.delegated_admin_account_id}}</p>
    <p>Inspector member accounts: {{organization.members_count}}</p>
    <p>Code Repository: {{scan_types.codeRepository.status}}</p>
  </div>
</script>
<script>
  Handlebars.registerPartial("services.inspector2.regions.id.accounts",
    $("#services\\.inspector2\\.regions\\.id\\.accounts\\.partial").html());
</script>
<script id="single_inspector2_account-template" type="text/x-handlebars-template">
  {{> modal-template template='services.inspector2.regions.id.accounts' }}
</script>
<script>
  var single_inspector2_account_template =
    Handlebars.compile($("#single_inspector2_account-template").html());
</script>
