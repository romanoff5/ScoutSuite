<!-- M10-F ECS cluster details escaped through Handlebars. -->
<script id="services.ecs.regions.id.clusters.partial" type="text/x-handlebars-template">
  <div class="list-group-item active"><h4>{{name}}</h4></div>
  <div class="list-group-item">
    <h4>ECS cluster</h4>
    <ul>
      <li>Cluster ARN: <samp>{{cluster_arn}}</samp></li>
      <li>Region: {{region}}</li>
      <li>Status: {{status}}</li>
      <li>Container Insights: {{container_insights}}</li>
      <li>Running tasks: {{running_tasks_count}}</li>
      <li>Pending tasks: {{pending_tasks_count}}</li>
      <li>Active services: {{active_services_count}}</li>
      <li>Container instances: {{registered_container_instances_count}}</li>
      <li>Exec logging: {{configuration.executeCommandConfiguration.logging}}</li>
      <li>Exec KMS key: <samp>{{configuration.executeCommandConfiguration.kmsKeyId}}</samp></li>
    </ul>
    <h4>Tags</h4>
    {{#each tags}}<p>{{key}}: {{value}}</p>{{/each}}
  </div>
</script>
<script>
  Handlebars.registerPartial("services.ecs.regions.id.clusters",
    $("#services\\.ecs\\.regions\\.id\\.clusters\\.partial").html());
</script>
<script id="single_ecs_cluster-template" type="text/x-handlebars-template">
  {{> modal-template template='services.ecs.regions.id.clusters' }}
</script>
<script>
  var single_ecs_cluster_template = Handlebars.compile(
    $("#single_ecs_cluster-template").html());
</script>
