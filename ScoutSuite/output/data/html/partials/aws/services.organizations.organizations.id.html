<!-- M10-C Organizations. Escaped diagnostic fields including management account contact. -->
<script id="services.organizations.organizations.id.partial" type="text/x-handlebars-template">
  <div class="list-group-item active"><h4 class="list-group-item-heading">{{name}}</h4></div>
  <div class="list-group-item"><h4>Organizations inventory</h4>
    <ul>
      <li>Organization ID: <samp>{{id}}</samp></li>
      <li>ARN: <samp>{{arn}}</samp></li>
      <li>Feature set: {{feature_set}}</li>
      <li>Management account ID: <samp>{{management_account_id}}</samp></li>
      <li>Management account ARN: <samp>{{management_account_arn}}</samp></li>
      <li>Management account e-mail: <samp>{{management_account_email}}</samp></li>
      {{#if available_policy_types}}
      <li>Deprecated organization-level policy summary (root states are authoritative):
        <ul>{{#each available_policy_types}}<li>{{type}}: {{status}}</li>{{/each}}</ul>
      </li>
      {{/if}}
    </ul>
  </div>
</script>
<script>
  Handlebars.registerPartial("services.organizations.organizations.id", $("#services\\.organizations\\.organizations\\.id\\.partial").html());
</script>
<script id="single_organizations_organization-template" type="text/x-handlebars-template">
  {{> modal-template template='services.organizations.organizations.id' }}
</script>
<script>
  var single_organizations_organization_template = Handlebars.compile($("#single_organizations_organization-template").html());
</script>
