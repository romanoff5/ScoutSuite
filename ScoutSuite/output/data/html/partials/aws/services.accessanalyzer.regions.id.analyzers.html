<!-- M10-A: escaped text only; no untrusted URLs or event attributes. -->
<script id="services.accessanalyzer.regions.id.analyzers.partial" type="text/x-handlebars-template">
  <div class="list-group-item active">
    <h4 class="list-group-item-heading">{{name}}</h4>
  </div>
  <div class="list-group-item">
    <h4>Analyzer configuration</h4>
    <ul>
      <li>ARN: <samp>{{arn}}</samp></li>
      <li>Region: {{region}}</li>
      <li>Type: {{type}}</li>
      <li>Status: {{status}}</li>
      <li>Status reason: {{status_reason}}</li>
      <li>Evaluation: {{evaluation_status}}</li>
      <li>Created: {{created_at}}</li>
      <li>Last resource analyzed: <samp>{{last_resource_analyzed}}</samp></li>
      <li>Last analysis: {{last_resource_analyzed_at}}</li>
      <li>Tags: <ul>{{#each tags}}<li>{{@key}}: {{this}}</li>{{/each}}</ul></li>
    </ul>
  </div>
</script>
<script>
  Handlebars.registerPartial(
    "services.accessanalyzer.regions.id.analyzers",
    $("#services\\.accessanalyzer\\.regions\\.id\\.analyzers\\.partial").html()
  );
</script>

<script id="single_accessanalyzer_analyzer-template" type="text/x-handlebars-template">
  {{> modal-template template='services.accessanalyzer.regions.id.analyzers' }}
</script>
<script>
  var single_accessanalyzer_analyzer_template = Handlebars.compile(
    $("#single_accessanalyzer_analyzer-template").html()
  );
</script>
