<!-- M10-Q: escaped, read-only S3 advanced resource detail. -->
<script id="services.s3.advanced.multi_region_access_points.partial" type="text/x-handlebars-template">
<div class="list-group-item active"><h4>{{name}}</h4></div>
<div class="list-group-item">
  <h4> S3 Multi-Region Access Point </h4>
  <ul>
    <li>Region: {{region}}</li>
    <li>ARN: <samp>{{AccessPointArn}}{{AccessGrantArn}}{{AccessGrantsInstanceArn}}{{BucketArn}}</samp></li>
    <li>Bucket: <samp>{{Bucket}}</samp></li>
    <li>Account: {{BucketAccountId}}</li>
    <li>Network origin: {{NetworkOrigin}}</li>
    <li>Policy status: {{policy_status}}</li>
    <li>Policy is public (review, not proof of access): {{policy_public}}</li>
    <li>Detail collection complete: {{detail_complete}}</li>
    <li>MRAP status: {{Status}}</li><li>Regions: {{#each Regions}}{{Bucket}} ({{Region}}) {{/each}}</li><li>Public policy review: {{public_policy_review}}</li>
  </ul>
</div>
</script>
<script>Handlebars.registerPartial("services.s3.advanced.multi_region_access_points",
 $("#services\\.s3\\.advanced\\.multi_region_access_points\\.partial").html());</script>
<script id="single_s3_advanced_multi_region_access_points-template" type="text/x-handlebars-template">
 {{> modal-template template='services.s3.advanced.multi_region_access_points' }}
</script>

 Handlebars.compile($("#single_s3_advanced_multi_region_access_points-template").html());</script>
