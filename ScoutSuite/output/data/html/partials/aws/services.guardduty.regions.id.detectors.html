<!-- M10-B GuardDuty: all detector fields are escaped by Handlebars. -->
<script id="services.guardduty.regions.id.detectors.partial" type="text/x-handlebars-template">
  <div class="list-group-item active">
    <h4 class="list-group-item-heading">{{name}}</h4>
  </div>
  <div class="list-group-item">
    <h4>GuardDuty detector</h4>
    <ul>
      <li>Detector ID: <samp>{{detector_id}}</samp></li>
      <li>Region: {{region}}</li>
      <li>Status: {{status}}</li>
      <li>Finding publishing frequency: {{finding_publishing_frequency}}</li>
      <li>Created: {{created_at}}</li>
      <li>Updated: {{updated_at}}</li>
      <li>Service role: <samp>{{service_role}}</samp></li>
      <li>Feature configuration:
        <ul>{{#each features}}
          <li>{{name}}: {{status}}
            <ul>{{#each additionalConfiguration}}<li>{{name}}: {{status}}</li>{{/each}}</ul>
          </li>
        {{/each}}</ul>
      </li>
      <li>S3 protection: {{data_sources.S3Logs.Status}}</li>
      <li>Kubernetes audit log protection: {{data_sources.Kubernetes.AuditLogs.Status}}</li>
      <li>Tags: <ul>{{#each tags}}<li>{{@key}}: {{this}}</li>{{/each}}</ul></li>
    </ul>
  </div>
</script>
<script>
  Handlebars.registerPartial(
    "services.guardduty.regions.id.detectors",
    $("#services\\.guardduty\\.regions\\.id\\.detectors\\.partial").html()
  );
</script>
<script id="single_guardduty_detector-template" type="text/x-handlebars-template">
  {{> modal-template template='services.guardduty.regions.id.detectors' }}
</script>
<script>
  var single_guardduty_detector_template = Handlebars.compile(
    $("#single_guardduty_detector-template").html()
  );
</script>
