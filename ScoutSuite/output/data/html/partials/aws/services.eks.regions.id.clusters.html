<!-- M10-G EKS: cluster identifiers and endpoint data are escaped. -->
<script id="services.eks.regions.id.clusters.partial" type="text/x-handlebars-template">
  <div class="list-group-item active"><h4>{{name}}</h4></div>
  <div class="list-group-item">
    <h4>Amazon EKS cluster</h4>
    <ul>
      <li>Cluster ARN: <samp>{{cluster_arn}}</samp></li>
      <li>Region: {{region}}</li>
      <li>Status: {{status}}</li>
      <li>Kubernetes version: {{version}}</li>
      <li>Endpoint: <samp>{{endpoint}}</samp></li>
      <li>Role ARN: <samp>{{cluster_role_arn}}</samp></li>
      <li>Public endpoint: {{public_endpoint_access}}</li>
      <li>Private endpoint: {{private_endpoint_access}}</li>
      <li>Control-plane audit logging enabled: {{audit_logging_enabled}}</li>
      <li>Unrestricted public endpoint: {{public_endpoint_unrestricted}}</li>
    </ul>
    <h4>Allowed public CIDRs</h4>
    {{#each public_access_cidrs}}<p><samp>{{this}}</samp></p>{{/each}}
    <h4>Control-plane log types</h4>
    {{#each logging.clusterLogging}}
      <p>Enabled: {{enabled}}; Types: {{#each types}}{{this}} {{/each}}</p>
    {{/each}}
    <h4>Tags</h4>
    {{#each tags}}<p>{{@key}}: {{this}}</p>{{/each}}
  </div>
  <div class="list-group-item scout-p5d-pod-associations">
    <h4>EKS Pod Identity association evidence (AWS API)</h4>
    <p>Inventory: <samp>{{pod_identity_inventory_status}}</samp>;
       described: {{pod_identity_associations_count}}; issuer: <samp>{{oidc_issuer}}</samp></p>
    <p><small>Pod Identity is independent of IRSA. Association configuration is not proof
      that its ServiceAccount or Pod exists or currently obtains credentials.</small></p>
    {{#each pod_identity_associations}}
      <div class="scout-p5d-association">
        <div>Association: <samp>{{association_arn}}</samp></div>
        <div>Namespace/service account: <samp>{{namespace}}/{{service_account}}</samp></div>
        <div>Primary role: <samp>{{role_arn}}</samp></div>
        {{#if target_role_arn}}<div>Chained target role: <samp>{{target_role_arn}}</samp></div>{{/if}}
        <div>Describe: <samp>{{detail_collection_status}}</samp>;
          session policy: <samp>{{session_policy_status}}</samp>;
          session tags disabled: {{disable_session_tags}}</div>
      </div>
    {{/each}}
    {{#unless pod_identity_associations_count}}
      <p><small>Zero described associations may indicate a verified empty inventory
        or unavailable collection; inspect inventory status above.</small></p>
    {{/unless}}
  </div>

  {{> p5d.attack_paths}}
</script>
<script>
  Handlebars.registerPartial("services.eks.regions.id.clusters",
    $("#services\\.eks\\.regions\\.id\\.clusters\\.partial").html());
</script>
<script id="single_eks_cluster-template" type="text/x-handlebars-template">
  {{> modal-template template='services.eks.regions.id.clusters' }}
</script>
<script>
  var single_eks_cluster_template = Handlebars.compile(
    $("#single_eks_cluster-template").html());
</script>
