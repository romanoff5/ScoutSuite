<!-- M10-C Organizations. Escaped diagnostic fields; account contacts are required for remediation. -->
<script id="services.organizations.accounts.id.partial" type="text/x-handlebars-template">
  <div class="list-group-item active"><h4 class="list-group-item-heading">{{name}}</h4></div>
  <div class="list-group-item"><h4>Organizations inventory</h4>
    <ul>
      <li>Account ID: <samp>{{id}}</samp></li>
      <li>ARN: <samp>{{arn}}</samp></li>
      <li>Contact e-mail: <samp>{{email}}</samp></li>
      <li>State: {{state}}</li>
      <li>Legacy status (if returned): {{legacy_status}}</li>
      <li>Joined via: {{joined_method}}</li>
      <li>Joined at: {{joined_timestamp}}</li>
      <li>Organization path(s): <ul>{{#each paths}}<li>{{this}}</li>{{/each}}</ul></li>
      <li>SCP context collection: {{scp_context.collection_status}}</li>
      <li>Effective permissions verified: {{scp_context.effective_permissions_verified}}</li>
      <li>SCP inheritance path: <ul>{{#each scp_context.ancestor_path}}<li><samp>{{this}}</samp></li>{{/each}}</ul></li>
      <li>Attached SCPs by target:
        {{#each scp_context.attached_policies_by_target}}
          <p>Target: <samp>{{@key}}</samp></p>
          <ul>{{#each this}}<li>{{name}} / <samp>{{id}}</samp> / <samp>{{arn}}</samp></li>{{/each}}</ul>
        {{/each}}
      </li>
      <li>Policy versions:
        {{#each scp_context.policy_documents}}
          <p>Policy <samp>{{@key}}</samp>; Version: {{Version}}</p>
          {{#each Statement}}
            <p>SID: {{Sid}}; Effect: {{Effect}}; Action: {{Action}}; NotAction: {{NotAction}};
              Resource: {{Resource}}; NotResource: {{NotResource}}</p>
          {{/each}}
        {{/each}}
      </li>
    </ul>
  </div>
</script>
<script>
  Handlebars.registerPartial("services.organizations.accounts.id", $("#services\\.organizations\\.accounts\\.id\\.partial").html());
</script>
<script id="single_organizations_account-template" type="text/x-handlebars-template">
  {{> modal-template template='services.organizations.accounts.id' }}
</script>
<script>
  var single_organizations_account_template = Handlebars.compile($("#single_organizations_account-template").html());
</script>
