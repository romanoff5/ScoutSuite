<!-- M10-L: all Identity Center evidence is escaped by Handlebars. -->
<script id="services.identitycenter.regions.id.instances.id.users.partial" type="text/x-handlebars-template">
  <div class="list-group-item active"><h4>{{name}}</h4></div>
  <div class="list-group-item">
    <h4>Identity Store user</h4>
    <p>User ID: <samp>{{id}}</samp>; Username: {{user_name}}</p>
    <p>Display name: {{display_name}}; Active: {{active}}</p>
    <p>Primary email: <samp>{{primary_email}}</samp></p>
    <h4>All available e-mail addresses</h4>
    {{#each emails}}<p><samp>{{this}}</samp></p>{{/each}}
    <h4>External identity references</h4>
    {{#each external_ids}}<p>{{Issuer}} / {{Id}}</p>{{/each}}
  </div>
</script>
<script>
  Handlebars.registerPartial("services.identitycenter.regions.id.instances.id.users", $("#services\\.identitycenter\\.regions\\.id\\.instances\\.id\\.users\\.partial").html());
</script>
<script id="single_identitycenter_user-template" type="text/x-handlebars-template">
  {{> modal-template template='services.identitycenter.regions.id.instances.id.users' }}
</script>
<script>
  var single_identitycenter_user_template =
    Handlebars.compile($("#single_identitycenter_user-template").html());
</script>
