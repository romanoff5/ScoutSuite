<!-- secretsmanager secrets -->
<script id="services.secretsmanager.regions.id.secrets.partial" type="text/x-handlebars-template">
    <div id="resource-name" class="list-group-item active">
        <h4 class="list-group-item-heading">{{name}}</h4>
    </div>
    <div class="list-group-item">
        <h4 class="list-group-item-heading">Information</h4>
        <div class="list-group-item-text item-margin">Name: <span id="secretsmanager.regions.{{region}}.secrets.{{@key}}.name"><samp>{{value_or_none name}}</samp></span></div>
        <div class="list-group-item-text item-margin">ARN: <span id="secretsmanager.regions.{{region}}.secrets.{{@key}}.arn"><samp>{{value_or_none arn}}</samp></span></div>
        <div class="list-group-item-text item-margin">Description: <span id="secretsmanager.regions.{{region}}.secrets.{{@key}}.description"><samp>{{value_or_none description}}</samp></span></div>
        <div class="list-group-item-text item-margin">Last Changed Date: <span id="secretsmanager.regions.{{region}}.secrets.{{@key}}.last_changed_date"><samp>{{format_date last_changed_date}}</samp></span></div>
        <div class="list-group-item-text item-margin">Last Accessed Date: <span id="secretsmanager.regions.{{region}}.secrets.{{@key}}.last_accessed_date"><samp>{{format_date last_accessed_date}}</samp></span></div>
        <div class="list-group-item-text item-margin">Created Date: <span id="secretsmanager.regions.{{region}}.secrets.{{@key}}.created_date"><samp>{{format_date created_date}}</samp></span></div>
        <div class="list-group-item-text item-margin">Usage status: <span id="secretsmanager.regions.{{region}}.secrets.{{@key}}.unused_status"><samp>{{unused_status}}</samp></span>{{#if days_since_last_access}} (<samp>{{days_since_last_access}}</samp> days since last access; threshold <samp>{{unused_threshold_days}}</samp>){{/if}}</div>
        {{#if deleted_date}}
        <div class="list-group-item-text item-margin">Scheduled Deletion Date: <span id="secretsmanager.regions.{{region}}.secrets.{{@key}}.deleted_date"><samp>{{format_date deleted_date}}</samp></span></div>
        {{/if}}
        <div class="list-group-item-text item-margin">Owning Service: <span id="secretsmanager.regions.{{region}}.secrets.{{@key}}.owning_service"><samp>{{value_or_none owning_service}}</samp></span></div>
        <div class="list-group-item-text item-margin">Primary Region: <span id="secretsmanager.regions.{{region}}.secrets.{{@key}}.primary_region"><samp>{{value_or_none primary_region}}</samp></span></div>
        <div class="list-group-item-text item-margin">KMS Key: <span id="secretsmanager.regions.{{region}}.secrets.{{@key}}.kms"><samp>{{value_or_none kms}}</samp></span> (<samp>{{kms_key_type}}</samp>)</div>
        <div class="list-group-item-text item-margin">Details collection: <samp>{{value_or_none details_status}}</samp></div>
    </div>
    <div class="list-group-item">
        <h4 class="list-group-item-heading">Rotation</h4>
        <div class="list-group-item-text item-margin">Rotation status: <span id="secretsmanager.regions.{{region}}.secrets.{{@key}}.rotation_status"><samp>{{rotation_status}}</samp></span></div>
        <div class="list-group-item-text item-margin">Rotation Lambda ARN: <span id="secretsmanager.regions.{{region}}.secrets.{{@key}}.rotation_lambda_arn"><samp>{{value_or_none rotation_lambda_arn}}</samp></span></div>
        <div class="list-group-item-text item-margin">Rotation Interval (days): <span id="secretsmanager.regions.{{region}}.secrets.{{@key}}.rotation_interval"><samp>{{value_or_none rotation_interval}}</samp></span></div>
        <div class="list-group-item-text item-margin">Rotation Schedule: <span id="secretsmanager.regions.{{region}}.secrets.{{@key}}.rotation_schedule"><samp>{{value_or_none rotation_schedule}}</samp></span></div>
        <div class="list-group-item-text item-margin">Last Rotated Date: <span id="secretsmanager.regions.{{region}}.secrets.{{@key}}.last_rotated_date"><samp>{{format_date last_rotated_date}}</samp></span></div>
        <div class="list-group-item-text item-margin">Next Rotation Date: <span id="secretsmanager.regions.{{region}}.secrets.{{@key}}.next_rotation_date"><samp>{{format_date next_rotation_date}}</samp></span></div>
    </div>
    <div class="list-group-item">
        <h4 class="list-group-item-heading">Resource policy</h4>
        <div class="list-group-item-text item-margin">Policy collection: <samp>{{policy_status}}</samp></div>
        <div class="list-group-item-text item-margin">Exposure: <span id="secretsmanager.regions.{{region}}.secrets.{{@key}}.policy_exposure"><samp>{{policy_exposure}}</samp></span></div>
        {{#if policy_external_principals}}
        <div class="list-group-item-text item-margin">External principals:
            <ul>{{#each policy_external_principals}}<li><samp>{{this}}</samp></li>{{/each}}</ul>
        </div>
        {{/if}}
    </div>
    {{#if tags}}
    <div class="list-group-item">
        <h4 class="list-group-item-heading">Tags</h4>
        <ul>{{#each tags}}<li><samp>{{Key}}</samp>: <samp>{{Value}}</samp></li>{{/each}}</ul>
    </div>
    {{/if}}
    {{#if policy.Statement}}
    <div class="list-group-item">
        {{> accordion_policy name = 'Resource Permissions ' policy_path = (concat 'secretsmanager.regions' region 'secrets' @key 'policy') document = policy}}
    </div>
    {{/if}}
</script>

<script>
    Handlebars.registerPartial("services.secretsmanager.regions.id.secrets", $("#services\\.secretsmanager\\.regions\\.id\\.secrets\\.partial").html());
</script>

<!-- Single secretsmanager secret template -->
<script id="single_secretsmanager_secret-template" type="text/x-handlebars-template">
    {{> modal-template template='services.secretsmanager.regions.id.secrets'}}
</script>
<script>
    var single_secretsmanager_secret_template = Handlebars.compile($("#single_secretsmanager_secret-template").html());
</script>
