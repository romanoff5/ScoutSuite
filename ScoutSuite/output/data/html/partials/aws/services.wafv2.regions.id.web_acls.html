<!-- M10-J: all Web ACL data escapes through Handlebars. -->
<script id="services.wafv2.regions.id.web_acls.partial" type="text/x-handlebars-template">
  <div class="list-group-item active"><h4>{{name}}</h4></div>
  <div class="list-group-item">
    <h4>WAFv2 Web ACL</h4>
    <ul>
      <li>Web ACL ARN: <samp>{{web_acl_arn}}</samp></li>
      <li>Web ACL ID: <samp>{{web_acl_id}}</samp></li>
      <li>Region: {{region}}; Scope: {{scope}}</li>
      <li>Default action: {{default_action}}</li>
      <li>Rule count: {{rule_count}}</li>
      <li>Managed by Firewall Manager: {{managed_by_firewall_manager}}</li>
      <li>Logging status: {{logging_status}}</li>
      <li>Association state: {{association_status}}</li>
      <li>Association scope complete: {{association_scope_complete}}</li>
      <li>Confirmed associated resources: {{associated_resource_count}}</li>
    </ul>
    <h4>Associated resources</h4>
    {{#each associated_resources}}
      <p>{{resource_type}}: <samp>{{resource_arn}}</samp></p>
      {{#if distribution_id}}
        <p>CloudFront ID: <samp>{{distribution_id}}</samp>;
        Domain: <samp>{{domain_name}}</samp>;
        Status: {{distribution_status}}</p>
      {{/if}}
    {{/each}}
    <h4>Types checked</h4>
    {{#each checked_resource_types}}<p>{{this}}</p>{{/each}}
    <h4>Association checks incomplete</h4>
    {{#each unknown_resource_types}}<p>{{this}}</p>{{/each}}
    <h4>Rule inventory</h4>
    {{#each rules}}
      <p>Rule: {{name}} (priority {{priority}})</p>
      <p>Statement types: {{statement_types}}</p>
      <p>Managed rule group: {{managed_group_vendor}} / {{managed_group_name}}</p>
      <p>Referenced group ARN: <samp>{{rule_group_arn}}</samp></p>
    {{/each}}
    <h4>Logging destinations</h4>
    {{#each log_destinations}}
      <p><samp>{{this}}</samp></p>
    {{/each}}
  </div>

        <!-- M10-Q: all cross-service evidence is Handlebars-escaped and offline-safe. -->
        <div class="list-group-item">
            <h4>Cross-service coverage (M10-Q)</h4>
            <p>Independent target observation: {{m10q_protected_targets.state}}</p>
            <p>Actual request traffic independently verified: {{m10q_protected_targets.traffic_routing_through_waf_verified}}</p>
            <p>Target resource existence observed: {{m10q_protected_targets.independent_target_existence_confirmed}}</p>
            <p>Independent WAF attachment verified: {{m10q_protected_targets.independent_waf_attachment_verified}}</p>
            <p>Real request inspection verified: {{m10q_protected_targets.inspection_applied_to_requests_verified}}</p>
            <p>WAF attachment evidence: {{m10q_protected_targets.association_evidence_source}}</p>
            {{#each m10q_protected_targets.verified_resource_arns}}<p>Discovered target: <samp>{{this}}</samp></p>{{/each}}
            {{#each m10q_protected_targets.waf_association_arns}}<p>WAF association ARN: <samp>{{this}}</samp></p>{{/each}}
            <p>Scope: {{m10q_protected_targets.scope_note}}</p>
        </div>
</script>
<script>
  Handlebars.registerPartial("services.wafv2.regions.id.web_acls",
    $("#services\\.wafv2\\.regions\\.id\\.web_acls\\.partial").html());
</script>
<script id="single_wafv2_web_acl-template" type="text/x-handlebars-template">
  {{> modal-template template='services.wafv2.regions.id.web_acls' }}
</script>
<script>
  var single_wafv2_web_acl_template = Handlebars.compile(
    $("#single_wafv2_web_acl-template").html());
</script>
