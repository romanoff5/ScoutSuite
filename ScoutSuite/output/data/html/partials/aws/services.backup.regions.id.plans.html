<!-- AWS Backup: no raw HTML interpolation or external assets. -->
<script id="services.backup.regions.id.plans.partial" type="text/x-handlebars-template">
  <div class="list-group-item active"><h4>{{name}}</h4></div>
  <div class="list-group-item">
    <h4>Backup plan</h4>
    <ul>
      <li>ARN: <samp>{{backup_plan_arn}}</samp></li>
      <li>Plan ID: {{backup_plan_id}}</li>
      <li>Region: {{region}}</li>
      <li>Version: {{version_id}}</li>
      <li>Creation date: {{creation_date}}</li>
      <li>Last execution date: {{last_execution_date}}</li>
      <li>Creator request ID: {{creator_request_id}}</li>
    </ul>
    <h4>Backup selections ({{selection_count}})</h4>
    <p>Selections inventory complete: {{selection_collection_complete}}</p>
    {{#each selections}}<ul>
      <li>ID: {{SelectionId}}; plan ID: {{BackupPlanId}}</li>
      <li>Name: {{BackupSelection.SelectionName}}</li>
      <li>IAM role ARN: <samp>{{BackupSelection.IamRoleArn}}</samp></li>
      {{#each BackupSelection.Resources}}<li>Include ARN/pattern: <samp>{{this}}</samp></li>{{/each}}
      {{#each BackupSelection.NotResources}}<li>Exclude ARN/pattern: <samp>{{this}}</samp></li>{{/each}}
      {{#each BackupSelection.ListOfTags}}
        <li>Tag: {{ConditionType}} {{ConditionKey}} = {{ConditionValue}}</li>{{/each}}
      {{#each BackupSelection.Conditions.StringEquals}}
        <li>StringEquals: {{ConditionKey}} = {{ConditionValue}}</li>{{/each}}
      {{#each BackupSelection.Conditions.StringLike}}
        <li>StringLike: {{ConditionKey}} = {{ConditionValue}}</li>{{/each}}
      {{#each BackupSelection.Conditions.StringNotEquals}}
        <li>StringNotEquals: {{ConditionKey}} = {{ConditionValue}}</li>{{/each}}
      {{#each BackupSelection.Conditions.StringNotLike}}
        <li>StringNotLike: {{ConditionKey}} = {{ConditionValue}}</li>{{/each}}
    </ul>{{/each}}
    <h4>Protection evidence and observed execution</h4>
    <p>Correlation completeness: {{correlation_status}}</p>
    <p>{{correlation_note}}</p>
    {{#each matching_protected_resource_arns}}
      <p>Selected ARN with reported recovery point: <samp>{{this}}</samp></p>{{/each}}
    {{#each completed_job_resource_arns_with_recovery_point}}
      <p>Completed job and recovery point: <samp>{{this}}</samp></p>{{/each}}
    {{#each explicit_resource_arns_without_reported_recovery_point}}
      <p>Selected ARN without reported recovery point (review): <samp>{{this}}</samp></p>{{/each}}
    <h4>Recent observed backup jobs</h4>
    {{#each observed_backup_jobs}}<ul>
      <li>Job ID: {{BackupJobId}}; state: {{State}}; message category: {{MessageCategory}}</li>
      <li>Resource: <samp>{{ResourceArn}}</samp></li>
      <li>Created / completed: {{CreationDate}} / {{CompletionDate}}</li>
      <li>Status: {{StatusMessage}}</li>
    </ul>{{/each}}
    <h4>Backup rules ({{rule_count}})</h4>
    {{#each rules}}
      <ul>
        <li>Name: {{RuleName}}; ID: {{RuleId}}</li>
        <li>Target vault: <samp>{{TargetBackupVaultName}}</samp></li>
        <li>Schedule: {{ScheduleExpression}}; timezone: {{ScheduleExpressionTimezone}}</li>
        <li>Start / completion windows (minutes): {{StartWindowMinutes}} / {{CompletionWindowMinutes}}</li>
        <li>Lifecycle transition / deletion (days): {{Lifecycle.MoveToColdStorageAfterDays}} /
          {{Lifecycle.DeleteAfterDays}}</li>
        <li>Opt in for continuous backup: {{EnableContinuousBackup}}</li>
        {{#each CopyActions}}
          <li>Copy to <samp>{{DestinationBackupVaultArn}}</samp>;
            delete after: {{Lifecycle.DeleteAfterDays}} days</li>
        {{/each}}
        {{#each RecoveryPointTags}}<li>Tag {{@key}}: {{this}}</li>{{/each}}
      </ul>
    {{/each}}
    <h4>Advanced backup settings</h4>
    {{#each advanced_backup_settings}}
      <p>Resource type: {{ResourceType}}</p>
      {{#each BackupOptions}}<p>{{@key}}: {{this}}</p>{{/each}}
    {{/each}}
  </div>
</script>
<script>
  Handlebars.registerPartial("services.backup.regions.id.plans",
    $("#services\\.backup\\.regions\\.id\\.plans\\.partial").html());
</script>
<script id="single_backup_plan-template" type="text/x-handlebars-template">
  {{> modal-template template='services.backup.regions.id.plans' }}
</script>
<script>
  var single_backup_plan_template = Handlebars.compile(
    $("#single_backup_plan-template").html());
</script>
