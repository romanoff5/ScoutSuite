<!-- M10-L: all Identity Center evidence is escaped by Handlebars. -->
<script id="services.identitycenter.regions.id.instances.id.groups.partial" type="text/x-handlebars-template">
  <div class="list-group-item active"><h4>{{name}}</h4></div>
  <div class="list-group-item">
    <h4>Identity Store group</h4>
    <p>Group ID: <samp>{{id}}</samp>; Description: {{description}}</p>
    <h4>Member email addresses</h4>
    {{#each member_emails}}<p><samp>{{this}}</samp></p>{{/each}}
    <h4>Memberships</h4>
    {{#each members}}
      <p>Membership: <samp>{{id}}</samp>; User: {{user_name}} / <samp>{{user_id}}</samp></p>
      {{#each emails}}<p><samp>{{this}}</samp></p>{{/each}}
    {{/each}}
    <h4>External identity references</h4>
    {{#each external_ids}}<p>{{Issuer}} / {{Id}}</p>{{/each}}
  </div>
</script>
<script>
  Handlebars.registerPartial("services.identitycenter.regions.id.instances.id.groups", $("#services\\.identitycenter\\.regions\\.id\\.instances\\.id\\.groups\\.partial").html());
</script>
<script id="single_identitycenter_group-template" type="text/x-handlebars-template">
  {{> modal-template template='services.identitycenter.regions.id.instances.id.groups' }}
</script>
<script>
  var single_identitycenter_group_template =
    Handlebars.compile($("#single_identitycenter_group-template").html());
</script>
