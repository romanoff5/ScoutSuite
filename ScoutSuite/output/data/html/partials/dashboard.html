<!-- Dashboard partial -->
<script id="services.id.findings.partial" type="text/x-handlebars-template">
<div class="row" id="services.{{service_name}}.findings.row">
    <div class="col-sm-12" id="services.{{service_name}}.findings.list">
        <div class="form-group container row">
        <div class="col-sm-2">
            <input class="form-control dashboard-filter" type="text" id="dashboardFilter" placeholder="Filter findings">
        </div>
        <div class="col-sm-2">
            <button class="form-control btn btn-light" id="finding-title">Show All</button>
        </div>
        <div class="col-sm-2">
            <button class="form-control btn btn-success" id="finding-title-good">Good</button>
        </div>
        <div class="col-sm-2">
            <button class="form-control btn btn-warning" id="finding-title-warning">Warning</button>
        </div>
        <div class="col-sm-2">
            <button class="form-control btn btn-outline-secondary" id="finding-title-review">Review</button>
        </div>
        <div class="col-sm-2">
            <button class="form-control btn btn-danger" id="finding-title-danger">Danger</button>
        </div>
        </div>

        <ul class="list-group accordion">
            {{#each_dict_as_sorted_list findings}}
                <div id="list-{{key}}" class="card finding_items">
                <div class="card-header row finding-title finding-title-{{dashboard_color level checked_items flagged_items assessment_status}} plain-link">
                    <div class="col-sm-11">
                        <i class="fa finding-badge finding-badge-{{dashboard_color level checked_items flagged_items assessment_status}}"></i>
                        <a href="#services.{{../service_name}}.findings.{{key}}.items">{{description}}</a>
                        {{#ifEqual assessment_status "incomplete"}}
                        <span class="badge badge-secondary" title="The evidence is incomplete; this is not a verified configuration finding">INCOMPLETE · UNVERIFIED</span>
                        {{/ifEqual}}
                        {{#if finding_disposition}}
                        <span class="badge badge-secondary">{{finding_disposition}}</span>
                        {{/if}}
                    </div>
                    <div class="col-sm-1">
                        <button class="finding btn fa collapsed" style="background-color:transparent" data-toggle="collapse" data-target="#item-{{key}}" aria-expanded="false" aria-controls="item-{{key}}"></button>
                    </div>
                </div>
                <div class="collapse" id="item-{{key}}" aria-labelledby="item-{{key}}" data-parent="#list-{{key}}">
                    <div class="card-body row">
                        <div class="col-sm-9">
                            <b>Description</b><br>
                            {{#if rationale}}
                                <p class="scout-finding-text">{{rationale}}</p>
                            {{else}}
                                <p>No description available.</p>
                            {{/if}}
                            {{#if remediation}}
                                <b>Remediation</b><br>
                                <p class="scout-finding-text">{{remediation}}</p>
                            {{/if}}
                            {{#if compliance}}
                            <b>Compliance</b><br>
                            <ul>
                                {{#each compliance}}
                                <li>{{this.name}} version {{this.version}}, reference {{this.reference}}</li>
                                {{/each}}
                            </ul>
                            <br>
                            {{/if}}
                            {{#if references}}
                                <b>References</b><br>
                                <ul>
                                    {{#each references}}
                                    <li><a href="{{safe_report_href this}}" rel="noopener noreferrer" target="_blank">{{this}}</a></li>
                                    {{/each}}
                                </ul>
                            {{/if}}
                        </div>
                        <div class="col-sm-3">
                            <ul>
                                <li>{{dashboard_name}} checked: {{checked_items}}</li>
                                <li>{{dashboard_name}} flagged: {{flagged_items}}</li>
                                {{#if assessment_status}}
                                <li>Assessment status: {{assessment_status}}</li>
                                {{/if}}
                                {{#if confidence_assessment}}
                                <li>Claim: {{confidence_assessment.claim_type}}</li>
                                <li>Verification: {{confidence_assessment.verification_status}}</li>
                                <li>Confidence: {{confidence_assessment.confidence}}</li>
                                <li>Evidence quality: {{confidence_assessment.evidence_quality}}</li>
                                {{#each confidence_assessment.reason_codes}}
                                <li>Reason: {{this}}</li>
                                {{/each}}
                                {{/if}}
                                {{#if policy_requirement}}
                                <li>Policy requirement: {{policy_requirement}}</li>
                                <li>Severity assigned by policy: {{severity_assigned}}</li>
                                {{#if policy_profile}}
                                <li>Selected policy profile: {{policy_profile.id}} / {{policy_profile.version}}</li>
                                {{/if}}
                                {{#if policy_threshold}}
                                <li>Approved policy threshold: {{policy_threshold}}</li>
                                {{/if}}
                                {{/if}}
                                {{#if evaluation_summary.counts.unknown}}
                                <li>{{dashboard_name}} with unknown evidence: {{evaluation_summary.counts.unknown}}</li>
                                {{/if}}
                            </ul>
                        </div>
                        {{#if finding_cards}}
                        <div class="col-sm-12 scout-evidence-cards">
                            <h4>Per-resource evidence and confidence</h4>
                            {{#each finding_cards}}
                            <div class="card scout-evidence-card" style="margin-bottom: 12px">
                                <div class="card-header">
                                    <strong>Severity: {{severity}}</strong>
                                    <span class="badge badge-secondary">Confidence: {{confidence}}</span>
                                    <span class="badge badge-light">Evidence: {{evidence_quality}}</span>
                                    <div><strong>Resource:</strong> {{resource_name}} ({{resource_id}})</div>
                                    {{#if resource_arn}}<div><strong>ARN:</strong> <samp>{{resource_arn}}</samp></div>{{/if}}
                                    {{#if account_id}}<div><strong>Account:</strong> <samp>{{account_id}}</samp></div>{{/if}}
                                    {{#if owner_id}}<div><strong>Owner:</strong> <samp>{{owner_id}}</samp></div>{{/if}}
                                    <small>Resource path: <samp>{{resource_path}}</samp></small>
                                </div>
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-sm-3"><strong>Severity</strong><div>{{severity}}</div></div>
                                        <div class="col-sm-3"><strong>Confidence</strong><div>{{confidence}}</div></div>
                                        <div class="col-sm-3"><strong>Collection</strong><div>{{collection}}</div></div>
                                        <div class="col-sm-3"><strong>Reachability</strong><div>{{reachability}}</div></div>
                                    </div>
                                    <p><strong>Claim:</strong> {{claim_type}};
                                        <strong>Verification:</strong> {{verification_status}};
                                        <strong>Mandatory predicates:</strong>
                                        {{confirmed_required_conditions}}/{{required_conditions}}
                                    </p>
                                    <strong>Supporting evidence</strong>
                                    <ul>
                                    {{#each supporting_evidence}}
                                        <li><strong>{{state}}</strong> — {{label}}: {{detail}}
                                            <small>(source: <samp>{{source}}</samp>{{#if required}}, required{{/if}})</small>
                                        </li>
                                    {{/each}}
                                    </ul>
                                    {{#if technical_attributes}}
                                    <details>
                                        <summary>Observed diagnostic attributes</summary>
                                        <ul>{{#each technical_attributes}}
                                            <li><samp>{{name}}</samp>: <samp>{{value}}</samp></li>
                                        {{/each}}</ul>
                                    </details>
                                    {{/if}}
                                    {{#if reason_codes}}
                                    <div><strong>Confidence rationale:</strong>
                                        {{#each reason_codes}}<samp>{{this}}</samp> {{/each}}
                                    </div>
                                    {{/if}}
                                </div>
                            </div>
                            {{/each}}
                        </div>
                        {{/if}}
                    </div>
                </div>
            </div>
            {{/each_dict_as_sorted_list}}
        </ul>

    </div>
</div>
</script>
<script>
Handlebars.registerPartial("dashboard", $("#services\\.id\\.findings\\.partial").html());
</script>
<script>
    // Dashboard filtering
    $(document).ready(function(){
        // Filter by text search
        $(".dashboard-filter").on("keyup", function() {
            var value = $(this).val().toLowerCase()
            $(".finding_items").filter(function() {
                $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
            })
        })

        // Filter by button
        $('.btn').click(function() {
            var value = $(this).attr('id')
            // Expand/collapse buttons have no id; only the filter buttons do.
            if (typeof value === 'string' && value.indexOf('finding-title') > -1){
                $(".finding_items").filter(function() {
                    $(this).toggle($(this).find(">:first-child").attr("class").indexOf(value) > -1)
                });
            }
            $(".dashboard-filter").val("")
        })
    })
</script>
