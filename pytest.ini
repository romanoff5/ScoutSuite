[pytest]
addopts = --strict-markers --disable-plugin-autoload -p pytest_cov
testpaths = tests
filterwarnings =
    error::RuntimeWarning
    error::pytest.PytestUnraisableExceptionWarning
    error::pytest.PytestUnhandledThreadExceptionWarning
    error::pytest.PytestReturnNotNoneWarning
    error:It is deprecated to return a value that is not None from a test case:DeprecationWarning
markers =
    credential: tests that require external credentials
    cloudwatch: working against real CloudWatch environments
    profiles: run tests that use specific profiles
