name: Offline CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11.18'
          - os: windows-2022
            python: '3.11.9'
          - os: ubuntu-24.04
            python: '3.14.10'
          - os: windows-2022
            python: '3.14.10'
    env:
      SCOUT_CI_ENFORCE_OS_ISOLATION: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      SOURCE_DATE_EPOCH: '1793404800'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select verified interpreter
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          check-latest: false
      - name: Set private environment root
        shell: pwsh
        run: '"SCOUT_CI_ROOT=$env:RUNNER_TEMP/scoutsuite-ci" >> $env:GITHUB_ENV'
      - name: Cache dependency downloads and validated dependency wheelhouse
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/scoutsuite-ci/pip-cache
            ${{ runner.temp }}/scoutsuite-ci/wheelhouse
            ${{ runner.temp }}/scoutsuite-ci/wheelhouse-manifest.json
          key: offline-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python }}-${{ hashFiles('requirements*.txt', 'dev-requirements.txt', 'tests/requirements*.txt', 'constraints/**', 'pyproject.toml') }}
          restore-keys: |
            offline-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python }}-
      - name: Acquire pinned dependencies and workflow validator (online setup only)
        id: acquire
        run: python -B tools/ci.py acquire
      - name: Enforce Windows interpreter network isolation
        id: firewall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci_windows_firewall.ps1 -Mode Install
      - name: Validate workflows
        if: "!cancelled() && steps.acquire.outcome == 'success' && (runner.os != 'Windows' || steps.firewall.outcome == 'success')"
        run: python -B tools/ci.py workflows
      - name: Build and install wheel and sdist without dependency acquisition
        id: build
        if: "!cancelled() && steps.acquire.outcome == 'success' && (runner.os != 'Windows' || steps.firewall.outcome == 'success')"
        run: python -B tools/ci.py build
      - name: Check installed dependencies
        if: "!cancelled() && steps.build.outcome == 'success'"
        run: python -B tools/ci.py dependencies
      - name: Lint (enforced repository configuration)
        if: "!cancelled() && steps.build.outcome == 'success'"
        run: python -B tools/ci.py lint
      - name: Full guarded offline suite including M01 negative and CLI cases
        if: "!cancelled() && steps.build.outcome == 'success'"
        run: python -B tools/ci.py tests
      - name: P3-C anonymized coverage and synthetic TP-FP-UNKNOWN quality gate
        if: "!cancelled() && steps.build.outcome == 'success'"
        run: python -B tools/ci.py p3c
      - name: Real TCP loopback SQLite report HTTP integration (isolated Linux namespace)
        if: "!cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux'"
        run: python -B tools/ci.py sqlite_http
      - name: Network-isolated adversarial XSS parser and browser verification
        if: "!cancelled() && steps.build.outcome == 'success'"
        run: python -B tools/ci.py xss_browser
      - name: Network-isolated end-to-end report browser checks (Playwright)
        # Temporary narrow exception (owner: fork maintainer; tracked in MODERNIZATION_PROGRESS.md
        # "RC8 E2E Windows/3.11"; expires when the cause is fixed): on this job only, Chrome and
        # Edge on the same windows-2022 image refuse DevTools with "requires a non-default data
        # directory" despite an explicit fresh --user-data-dir. Linux 3.11/3.14 and Windows 3.14 enforce it.
        if: "!cancelled() && steps.build.outcome == 'success' && !(runner.os == 'Windows' && matrix.python == '3.11.9')"
        run: python -B tools/ci.py report_e2e
      - name: Guarded installed package and minimal dependency smoke
        if: "!cancelled() && steps.build.outcome == 'success'"
        run: python -B tools/ci.py packaging
      - name: Validate master install PowerShell scripts and fail-closed selection
        if: "!cancelled() && steps.build.outcome == 'success' && runner.os == 'Windows'"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('install-fork.ps1', 'select-scanner.ps1', 'invoke-selected-scout.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD "scripts/$name"), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "PowerShell parse error: $name : $($errors | Out-String)" }
          }
          $root = Join-Path $env:RUNNER_TEMP ('scout-main-selection-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root | Out-Null
          try {
            $older = '.venv-scout-fork-main-' + ('b' * 12)
            $newer = '.venv-scout-fork-main-' + ('a' * 12)
            foreach ($name in @('.venv-scout', $older, $newer)) {
              $scripts = Join-Path $root (Join-Path $name 'Scripts')
              New-Item -ItemType Directory -Path $scripts -Force | Out-Null
              [IO.File]::WriteAllBytes((Join-Path $scripts 'scout.exe'), [byte[]]@(0, 1, 2))
            }
            foreach ($install in @(@($older, 'b', '2026-01-01T00:00:00Z'), @($newer, 'a', '2026-02-01T00:00:00Z'))) {
              [ordered]@{
                repository = 'romanoff5/ScoutSuite'; version = '5.14.0+romanoff5.main'
                git_sha = ($install[1] * 40); wheel_sha256 = ('b' * 64); constraints_sha256 = ('c' * 64)
                scout_exe_sha256 = ('0' * 64); installed_at_utc = $install[2]
              } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root "$($install[0])/fork-install.json")
            }
            & ./scripts/select-scanner.ps1 -Mode Fork -ToolkitRoot $root
            $config = Get-Content -LiteralPath (Join-Path $root '.scout-scanner-selection.json') -Raw | ConvertFrom-Json
            if ($config.mode -ne 'fork' -or $config.venv -ne $newer) { throw 'Selector did not pick the newest master install' }
            & ./scripts/select-scanner.ps1 -Mode Fork -GitSha ('b' * 7) -ToolkitRoot $root
            $config = Get-Content -LiteralPath (Join-Path $root '.scout-scanner-selection.json') -Raw | ConvertFrom-Json
            if ($config.venv -ne $older -or $config.git_sha -ne ('b' * 40)) { throw 'Selector did not pin the requested commit' }
            $rejected = $false
            try { & ./scripts/invoke-selected-scout.ps1 -ToolkitRoot $root --help }
            catch { $rejected = $_.Exception.Message -match 'executable changed after verification' }
            if (-not $rejected) { throw 'Modified fork executable was not rejected before invocation' }
            & ./scripts/select-scanner.ps1 -Mode Stable -ToolkitRoot $root
            $config = Get-Content -LiteralPath (Join-Path $root '.scout-scanner-selection.json') -Raw | ConvertFrom-Json
            if ($config.mode -ne 'stable') { throw 'Stable rollback selection failed' }
          } finally {
            Remove-Item -LiteralPath $root -Force -Recurse -ErrorAction SilentlyContinue
          }
      - name: Install actual wheel on Windows from offline pinned wheelhouse
        if: "!cancelled() && steps.build.outcome == 'success' && runner.os == 'Windows' && matrix.python == '3.11.9'"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ('scout-main-real-install-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root | Out-Null
          try {
            $wheel = @(Get-ChildItem -LiteralPath (Join-Path $env:SCOUT_CI_ROOT 'dist') -Filter '*romanoff5.main*.whl')
            if ($wheel.Count -ne 1) { throw 'Fork wheel missing from independently built CI dist' }
            $sha = (Get-FileHash -LiteralPath $wheel[0].FullName -Algorithm SHA256).Hash
            $commit = (git rev-parse HEAD).Trim()
            & ./scripts/install-fork.ps1 -WheelPath $wheel[0].FullName -CommitSha $commit `
              -ExpectedSha256 $sha -ToolkitRoot $root `
              -WheelhousePath (Join-Path $env:SCOUT_CI_ROOT 'wheelhouse') `
              -PythonCommand (Get-Command python).Source
            $venv = '.venv-scout-fork-main-' + $commit.Substring(0, 12)
            if (-not (Test-Path -LiteralPath (Join-Path $root "$venv/fork-install.json"))) {
              throw 'Verified installation provenance missing'
            }
            $config = Get-Content -LiteralPath (Join-Path $root '.scout-scanner-selection.json') -Raw | ConvertFrom-Json
            if ($config.venv -ne $venv) { throw 'Installer did not select the verified install' }
            & pwsh -NoProfile -File ./scripts/invoke-selected-scout.ps1 -ToolkitRoot $root --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Verified selected launcher help failed' }
            & pwsh -NoProfile -File ./scripts/invoke-selected-scout.ps1 -ToolkitRoot $root aws --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Verified AWS CLI help failed' }
          } finally {
            Remove-Item -LiteralPath $root -Force -Recurse -ErrorAction SilentlyContinue
          }
      - name: Summarize exact versions and gate outcomes
        if: always()
        run: python -B tools/ci.py summary
      - name: Remove only this job's firewall rules
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci_windows_firewall.ps1 -Mode Remove
