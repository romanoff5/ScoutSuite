name: Fork RC release

on:
  workflow_run:
    workflows: ["Offline CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish-fork-rc:
    if: >-
      ${{ github.repository == 'romanoff5/ScoutSuite' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact successful master CI SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # Required to independently verify RC1 hotfix ancestry.
          persist-credentials: false
      - name: Guard fork tag, release marker and immutable master SHA
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$EXPECTED_SHA"
          test -f docs/releases/fork-v5.14.0-m10-rc8.md
          grep -Fq "5.14.0+romanoff5.m10rc8" ScoutSuite/__init__.py
          if gh release view fork-v5.14.0-m10-rc8 --repo romanoff5/ScoutSuite >/dev/null 2>&1; then
            echo "Release already exists: cannot overwrite published assets."
            exit 1
          fi
          echo "RELEASE_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"
      - name: Use supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.18'
          check-latest: false
      - name: Ensure release SHA includes the RC2 runtime hotfix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 70cf29d5579864543b6363e7a271a84216bb6837^{commit})" = "70cf29d5579864543b6363e7a271a84216bb6837"
          git merge-base --is-ancestor 70cf29d5579864543b6363e7a271a84216bb6837 HEAD
      - name: Ensure release SHA includes the RC7 S3 backup evidence gap fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 409b07570b690cce67612e729718a6178a6d020a^{commit})" = "409b07570b690cce67612e729718a6178a6d020a"
          git merge-base --is-ancestor 409b07570b690cce67612e729718a6178a6d020a HEAD
      - name: Ensure release SHA includes the RC8 disabled-service evidence and report status fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 8c9f2d0dab2e11c17820c8dd0d6e9bebae37917c^{commit})" = "8c9f2d0dab2e11c17820c8dd0d6e9bebae37917c"
          git merge-base --is-ancestor 8c9f2d0dab2e11c17820c8dd0d6e9bebae37917c HEAD
      - name: Build pinned fork wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build==1.3.0 setuptools==80.9.0 wheel==0.45.1 twine==6.2.0
          python -m build --no-isolation --outdir dist
          python -m twine check dist/*
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          cp constraints/combined-py311.txt dist/runtime-py311.constraints.txt
      - name: Install the wheel in a clean isolated environment and smoke-test it
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/fork-rc-venv"
          FORK_PY="$RUNNER_TEMP/fork-rc-venv/bin/python"
          "$FORK_PY" -m pip install --disable-pip-version-check -c dist/runtime-py311.constraints.txt -c constraints/ci-py311.txt dist/*.whl
          "$FORK_PY" -m pip check
          "$RUNNER_TEMP/fork-rc-venv/bin/scout" --help >/dev/null
          "$RUNNER_TEMP/fork-rc-venv/bin/scout" aws --help >/dev/null
          cd "$RUNNER_TEMP"
          "$FORK_PY" -I -B "$GITHUB_WORKSPACE/tools/verify_distribution.py" --source "$GITHUB_WORKSPACE" --profile combined --output "$RUNNER_TEMP/fork-rc-smoke.json"
      - name: Manifest, SHA256SUMS, SBOM and AWS/rule/report matrix
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/fork-rc-venv/bin/python" -I -B tools/fork_release.py --root . --dist dist --sha "$RELEASE_SHA"
          "$RUNNER_TEMP/fork-rc-venv/bin/python" -m json.tool dist/manifest.json >/dev/null
          "$RUNNER_TEMP/fork-rc-venv/bin/python" -m json.tool dist/matrix.json >/dev/null
          "$RUNNER_TEMP/fork-rc-venv/bin/python" -m json.tool dist/sbom.cdx.json >/dev/null
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish only on this fork after ALL validation gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='fork-v5.14.0-m10-rc8'
          if gh api "repos/romanoff5/ScoutSuite/git/ref/tags/$TAG" >/tmp/existing-tag.json 2>/dev/null; then
            test "$(gh api "repos/romanoff5/ScoutSuite/git/ref/tags/$TAG" --jq '.object.sha')" = "$RELEASE_SHA"
          else
            gh api repos/romanoff5/ScoutSuite/git/refs -X POST -f "ref=refs/tags/$TAG" -f "sha=$RELEASE_SHA" >/dev/null
          fi
          gh release create "$TAG" dist/* --repo romanoff5/ScoutSuite --verify-tag --prerelease \
            --title "ScoutSuite fork 5.14.0+romanoff5.m10rc8" \
            --notes-file docs/releases/fork-v5.14.0-m10-rc8.md
          gh release view "$TAG" --repo romanoff5/ScoutSuite --json tagName,isPrerelease,url
